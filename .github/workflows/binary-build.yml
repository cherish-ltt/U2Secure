name: Binary Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.3.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build u2secure (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux ARM64（交叉编译）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_compile: true
          # musl 使用同架构 runner 的原生工具链
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            CLEAN_TAG="$INPUT_TAG"
          else
            CLEAN_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$CLEAN_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          echo "Using release tag: $CLEAN_TAG"
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          mkdir -p "$RUNNER_TEMP/release-metadata"
          printf '%s\n' "$CLEAN_TAG" > "$RUNNER_TEMP/release-metadata/tag"

      - name: Save release identity
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          overwrite: true
          path: ${{ runner.temp }}/release-metadata/tag
          if-no-files-found: error

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Resolve release notes file
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES_FILE="docs/versions/${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "Found release notes: $NOTES_FILE"
            echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
          else
            echo "No release notes at $NOTES_FILE, falling back to auto-generated notes"
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.cross_compile && matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/u2secure" "u2secure-${{ matrix.target }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: u2secure-*
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
