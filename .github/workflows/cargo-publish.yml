name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.4.0)'
        required: true
        type: string
  # 既有自动路径保留，但 crates.io Trusted Publishing 拒绝 workflow_run OIDC。
  # 当前须在 Binary Build 成功且两个 Linux 资产齐全后手动 workflow_dispatch；
  # 下面的轮询只核对上游结论，不能绕过该鉴权限制。
  # GITHUB_TOKEN 创建的 release 事件不会触发新运行，也不能改回 release 触发器。
  workflow_run:
    workflows: ["Binary Build"]   # 必须与 binary-build.yml 的 name 完全一致
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    # 手动派发始终放行；自动路径只在 Binary Build 成功时进入
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # 需要与你在 crates.io 上设置的 Environment 名称完全一致
    environment: release

    permissions:
      id-token: write  # 必须：用于请求 OIDC 令牌
      contents: read   # checkout 需要
      actions: read    # 轮询 Binary Build 运行状态需要

    steps:
      - name: Read built release identity
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-tag
          path: ${{ runner.temp }}/release-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RAW_REF="$INPUT_REF"
          else
            RAW_REF="$(cat "$RUNNER_TEMP/release-metadata/tag")"
          fi
          TAG="v${RAW_REF#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无法解析标签，原始值: '${RAW_REF}'"
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved tag : ${TAG}"

      - name: Wait for Binary Build to succeed
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # 重新核对上游运行的成功结论；这不改变 workflow_run 的 OIDC 限制。
          for i in $(seq 1 60); do
            info="$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
              --jq '.status + " " + (.conclusion // "none")')" || {
              echo "::error::无法查询 Binary Build 运行状态 (${RUN_ID})"
              exit 1
            }
            status="${info%% *}"
            conclusion="${info##* }"
            echo "[$i/60] Binary Build status=${status} conclusion=${conclusion}"
            case "${status}" in
              completed)
                if [[ "${conclusion}" == "success" ]]; then
                  echo "Binary Build 已成功完成，继续发布"
                  exit 0
                fi
                echo "::error::Binary Build 结论为 ${conclusion}，取消 crates.io 发布"
                exit 1
                ;;
              queued|in_progress|requested|waiting|pending)
                sleep 10
                ;;
              *)
                echo "::error::未知运行状态: ${status}"
                exit 1
                ;;
            esac
          done
          echo "::error::等待 Binary Build 超时（10 分钟）"
          exit 1

      - uses: actions/checkout@v4
        with:
          # workflow_run 下默认检出默认分支，必须显式指向发布标签
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          if [[ "v${CRATE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Cargo.toml 版本 (${CRATE_VERSION}) 与标签 (${TAG_VERSION}) 不一致"
            exit 1
          fi
          echo "版本校验通过: ${CRATE_VERSION}"

      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
