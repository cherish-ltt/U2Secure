name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.4.0)'
        required: true
        type: string
  # 自动化路径：GitHub Release 发布后触发。
  # Release 由 Binary Build 在二进制全部上传成功后创建，天然满足
  # "二进制先就绪、再发包"的顺序，无需额外门禁。
  # 注意：**不能**改成 workflow_run —— crates.io Trusted Publishing 出于安全考虑
  # 明确拒绝该触发器（返回 400: Trusted Publishing does not support the
  # workflow_run event trigger），这是平台限制。
  release:
    types: [published]   # 排除 draft 与 prerelease

jobs:
  publish:
    runs-on: ubuntu-latest
    # 可选但强烈推荐，需要与你在crates.io上设置的Environment名称完全一致
    environment: release
    # 手动派发与 Release 发布都放行；prerelease 不再重复触发（已在 triggers 过滤）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release'

    permissions:
      id-token: write  # 必须：用于请求OIDC令牌
      contents: read   # checkout 需要

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          # 手动派发用 inputs.tag_name；自动路径用 Release 的标签名
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_REF="${{ github.event.inputs.tag_name }}"
          else
            RAW_REF="${{ github.event.release.tag_name }}"
          fi
          TAG="v${RAW_REF#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::无法解析标签，原始值: '${RAW_REF}'"
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved tag : ${TAG}"

      - uses: actions/checkout@v4
        with:
          # workflow_run 下默认检出默认分支，必须显式指向发布标签
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          CRATE_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG_VERSION="${{ steps.tag.outputs.tag }}"
          if [[ "v${CRATE_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Cargo.toml 版本 (${CRATE_VERSION}) 与标签 (${TAG_VERSION}) 不一致"
            exit 1
          fi
          echo "版本校验通过: ${CRATE_VERSION}"

      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
