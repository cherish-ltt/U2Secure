name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.0 or v0.3.0)'
        required: true
        type: string
      npm_tag:
        description: 'npm dist-tag (latest, beta, next, etc.)；仅手动派发生效，留空即 latest'
        required: false
        default: ''
        type: string
  # 自动化路径：Binary Build 跑完后触发（成功与否由 job 级 if 闸门判定）。
  # 不再监听 tag push —— 避免 npm 版本号先于 GitHub Release 二进制上线，
  # 导致 postinstall 下载二进制 404。
  # 注意：workflow_run 使用的是**默认分支**上的本文件，修好工作流无需重新打标签。
  workflow_run:
    workflows: ["Binary Build"]   # 必须与 binary-build.yml 的 name 完全一致
    types: [completed]

env:
  CARGO_TERM_COLOR: always

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    name: Publish to npm (manual)
    runs-on: ubuntu-latest
    environment: release
    # 手动派发始终放行；自动路径只在 Binary Build 成功时发布
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Normalize version
        id: version
        shell: bash
        run: |
          # 手动派发用 inputs.version；自动路径（Binary Build 完成）用触发那次运行的标签。
          # workflow_run 事件的 payload 不含 ref_type / ref_name，标签只能取自 head_branch。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_REF="${{ github.event.inputs.version }}"
          else
            RAW_REF="${{ github.event.workflow_run.head_branch }}"
          fi
          CLEAN_VERSION="${RAW_REF#v}"
          if [[ ! "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::无法解析版本号，原始值: '${RAW_REF}'"
            exit 1
          fi
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved ref  : ${RAW_REF}"
          echo "Resolved tag  : v${CLEAN_VERSION}"
          echo "Resolved ver  : ${CLEAN_VERSION}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run 下默认检出默认分支，必须显式指向触发那次运行的 ref
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          mkdir -p npm-package/bin/native
          cd npm-package

          cat > package.json <<EOF
          {
            "name": "@ghyper9023/u2secure",
            "version": "${{ steps.version.outputs.version }}",
            "description": "Make your Linux system more secure through interactive CLI | 通过交互式的 CLI 让你的 Linux 系统更安全",
            "bin": {
              "u2secure": "bin/u2secure-wrapper.js"
            },
            "dependencies": {
              "follow-redirects": "^1.16.0"
            },
            "publishConfig": {
              "access": "public",
              "provenance": true
            },
            "scripts": {
              "postinstall": "node bin/install.js"
            },
            "files": [
              "bin"
            ],
            "keywords": ["cli", "security", "linux", "hardening", "u2secure"],
            "author": "cherish-ltt",
            "license": "MIT OR Apache-2.0",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/cherish-ltt/U2Secure.git"
            },
            "homepage": "https://github.com/cherish-ltt/U2Secure#readme",
            "bugs": {
              "url": "https://github.com/cherish-ltt/U2Secure/issues"
            }
          }
          EOF

          cat > bin/install.js <<'INSTALL_JS'
          #!/usr/bin/env node

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const { https } = require('follow-redirects');

          const pkgJson = require('../package.json');
          const version = pkgJson.version;
          const repoUrl = pkgJson.repository && pkgJson.repository.url;
          if (!repoUrl) {
            console.error('Missing repository.url in package.json');
            process.exit(1);
          }
          const match = repoUrl.match(/github\.com[\/:]([^\/]+\/[^\/]+)(\.git)?$/);
          if (!match) {
            console.error(`Failed to parse owner/repo from repository.url: ${repoUrl}`);
            process.exit(1);
          }
          // 修复：去除可能的 .git 后缀
          let repo = match[1];
          if (repo.endsWith('.git')) {
            repo = repo.slice(0, -4);
          }

          const tag = `v${version}`;

          function getPlatformAsset() {
            const platform = os.platform();
            const arch = os.arch();
            console.log(`Detected platform: ${platform}, arch: ${arch}`);

            if (platform === 'win32') {
              // Windows: currently only x64 builds are provided.
              if (arch === 'x64' || arch === 'ia32' || arch === 'arm64') {
                console.log('Using Windows x64 binary (compatible with all Windows architectures)');
                return 'u2secure-x86_64-pc-windows-msvc.exe';
              } else {
                throw new Error(`Unsupported Windows architecture: ${arch}`);
              }
            } else if (platform === 'linux') {
              if (arch === 'x64') {
                return 'u2secure-x86_64-unknown-linux-gnu';
              } else if (arch === 'arm64') {
                return 'u2secure-aarch64-unknown-linux-gnu';
              } else {
                throw new Error(`Unsupported Linux architecture: ${arch}`);
              }
            } else if (platform === 'darwin') {
              if (arch === 'arm64') {
                return 'u2secure-aarch64-apple-darwin';
              } else if (arch === 'x64') {
                return 'u2secure-x86_64-apple-darwin';
              } else {
                throw new Error(`Unsupported macOS architecture: ${arch}`);
              }
            } else {
              throw new Error(`Unsupported platform: ${platform}`);
            }
          }

          const assetName = getPlatformAsset();
          const destDir = path.join(__dirname, 'native');
          const destFile = path.join(destDir, os.platform() === 'win32' ? 'u2secure.exe' : 'u2secure');
          const url = `https://github.com/${repo}/releases/download/${tag}/${assetName}`;

          console.log(`Downloading from ${url} ...`);

          if (!fs.existsSync(destDir)) fs.mkdirSync(destDir, { recursive: true });

          const file = fs.createWriteStream(destFile);
          https.get(url, (response) => {
            if (response.statusCode !== 200) {
              console.error(`Failed to download ${url}: HTTP ${response.statusCode}`);
              process.exit(1);
            }
            response.pipe(file);
            file.on('finish', () => {
              file.close();
              fs.chmodSync(destFile, 0o755);
              console.log(`Binary saved to ${destFile}`);
            });
          }).on('error', (err) => {
            console.error(err);
            process.exit(1);
          });
          INSTALL_JS

          cat > bin/u2secure-wrapper.js <<'WRAPPER_JS'
          #!/usr/bin/env node
          const { spawn } = require('child_process');
          const path = require('path');
          const os = require('os');

          const exePath = path.join(__dirname, 'native', os.platform() === 'win32' ? 'u2secure.exe' : 'u2secure');
          const args = process.argv.slice(2);
          const child = spawn(exePath, args, { stdio: 'inherit' });
          child.on('exit', (code) => process.exit(code));
          WRAPPER_JS

          cat > README.md <<'README_EOF'
          # u2secure

          Linux 服务器安全加固工具（CLI + TUI 双模式），基于 Rust 构建。运行一次即可完成从系统更新、用户创建、SSH 深度加固、防火墙、入侵防御、审计到自动更新的完整安全基线建设。

          > Linux server security hardening tool (CLI + TUI) built with Rust. One run builds a complete security baseline: system updates, user creation, deep SSH hardening, firewall, intrusion prevention, auditing and automatic updates.
          >
          > 支持平台 / Supported platforms: Linux x86_64 & ARM64, macOS x86_64 & ARM64, Windows x64
          >
          > 详细文档与使用指南请访问 / For full documentation and usage guide, visit:
          > [GitHub 主页](https://github.com/cherish-ltt/U2Secure)
          README_EOF

      - name: Check whether version already published
        id: exists
        shell: bash
        run: |
          if npm view "@ghyper9023/u2secure@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "已有 npm 版本 ${{ steps.version.outputs.version }}，跳过发布（重跑安全）"
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm with provenance
        if: steps.exists.outputs.published != 'true'
        run: |
          cd npm-package
          npm publish --provenance --access public --tag "${{ github.event.inputs.npm_tag || 'latest' }}"
